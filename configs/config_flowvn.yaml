# FlowVN (Vishnevskiy, Walheim & Kozerke, Nature Machine Intelligence 2020) baseline.
#
#   uv run train.py --config-name config_flowvn
defaults:
  - model: flowvn
  - loss: final_l1
  - optimizer: adam_flowvn_ref
  - _self_

seed: 42
overwrite_existing: true
checkpoint_dir: checkpoints

data:
  root: ${oc.env:FLOWMODL_DATA_ROOT}
  split_path: data/dataset_splits.yaml
  train_on_all_data: false
  assume_temporal_cycle: true
  temporal_crop_size: 15
  spatial_crop_size: [64, 64, 5] # (z, y, x); only x (readout) is cropped

data_format: zarr

training:
  epochs: 50
  accumulation_steps: 1
  tau_multiplier: 1e-4
  gradient_clip_val: 1.0
  lr_scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    T_max: ${training.epochs}
  batch_size: 1
  num_workers: 2
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: true
  reconstruct_target_on_gpu: true
  reconstruct_temporal_chunk_size: null
  # FlowVN reconstructs one velocity encoding at a time; this many encodings
  # are folded into the batch axis per model call.
  nv_chunk_size: 2

validation:
  synthetic: true
  compute_on_cpu: false
  val_interval: 5
  val_accelerations: [30]
  checkpoint_accelerations: [10, 30, 50]
  checkpoint_eval_every: 2
  batch_size: 1
  num_workers: 0
  pin_memory: true
  reconstruct_target_on_gpu: true
  reconstruct_temporal_chunk_size: 2
  cache_in_memory: false

wandb:
  project: FlowMoDL
  name: flowvn
  dir: ./tmp/wandb
