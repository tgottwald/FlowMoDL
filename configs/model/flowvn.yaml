_target_: models.flowvn.FlowVN
# Settings of the reference FlowVN implementation.
num_layers: 10
use_checkpointing: true
use_amp: true              # bf16 autocast for the filter-bank convolutions only
lowmem: false              # loop over the batch axis of the filter banks to save memory
layer_params:
  in_channels: 1           # one velocity encoding at a time
  num_filters: 8
  use_usrate_mod: true     # modulate the step weights with the acceleration factor
  reg_params:
    filter_kernel_size: 5
    filter_init: zero_mean_norm_ball
    filter_init_std: 0.01
    bank_interp_params:
      num_knots: 71
      init_range: 3.5
      stddev_init: 0.05
  interp_params:
    num_knots: 71
    init_range: 7.0
    stddev_init: 0.05
  usrate_params:
    min_rate: 9.0
    max_rate: 51.0
    num_knots: 71
    stddev_init: 0.1
